<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CF2D8"/>
      <stop offset="55%" stop-color="#2BD3E4"/>
      <stop offset="100%" stop-color="#16A9D6"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFFFF3"/>
      <stop offset="100%" stop-color="#57F0DC"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="52%">
      <stop offset="0%" stop-color="#2BD3E4" stop-opacity="0.20"/>
      <stop offset="70%" stop-color="#2BD3E4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2BD3E4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 无底光：自适应图标会被系统裁切，保留纯色底更稳 -->

  <!-- 头带（左右） -->
  <rect x="200" y="398" width="56" height="76" rx="26" fill="#16A9D6" opacity="0.85"/>
  <rect x="768" y="398" width="56" height="76" rx="26" fill="#16A9D6" opacity="0.85"/>

  <!-- 头显本体 -->
  <rect x="236" y="296" width="552" height="280" rx="88" fill="url(#body)"/>

  <!-- 面罩内窗 -->
  <rect x="288" y="344" width="448" height="184" rx="56" fill="#0B1220"/>

  <!-- 双镜片 -->
  <rect x="326" y="386" width="140" height="100" rx="44" fill="url(#lens)"/>
  <rect x="558" y="386" width="140" height="100" rx="44" fill="url(#lens)"/>

  <!-- 在线绿点 -->
  <circle cx="512" cy="680" r="52" fill="#0B1018"/>
  <circle cx="512" cy="680" r="40" fill="#43B581"/>
</svg>

